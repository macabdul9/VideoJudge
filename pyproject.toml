[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videojudge"
version = "0.1.0"
description = "VideoJudge: MLLM-as-a-Judge for video understanding"
requires-python = ">=3.10"
dependencies = ["datasets>=3.2,<4", "numpy", "scipy", "tqdm", "requests", "json-repair", "datasketch"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "av"]
video = ["av"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
